name: Pattern proposal
description: A pattern that might catch AI-tells
labels: ["kaizen", "pattern-proposal"]
body:
  - type: textarea
    id: pattern
    attributes: { label: Pattern }
    validations: { required: true }
  - type: textarea
    id: examples
    attributes: { label: Examples, render: text }
    validations: { required: true }
  - type: textarea
    id: counter_examples
    attributes: { label: Text that must NOT fire }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes: { label: Source or counts }
    validations: { required: false }
