name: Missed tell
description: Something read as AI-written and nothing caught it
labels: ["kaizen", "missed-tell"]
body:
  - type: textarea
    id: excerpt
    attributes: { label: Flagged text (anonymise it), render: text }
    validations: { required: true }
  - type: textarea
    id: pattern
    attributes: { label: What gives it away }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Ruleset version, placeholder: "from the report's ruleset_version" }
    validations: { required: false }
