name: evals
# Paid `claude plugin eval` suites. Every run starts real Claude sessions billed to ANTHROPIC_API_KEY, so this runs
# only by hand, after the owner has OK'd the run. PRs stay free: ci.yml runs the engine-side eval tests, which call
# no model. The US$5 ceiling is checked before each run launches, so one invocation spends about US$5 plus up to 4
# runs already in flight (-j 4); `all` is two invocations, so about twice that. See guides/evals.md.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which cases to run: trigger (skill triggering), rewrite (rewrites vs a no-plugin baseline) or all"
        type: choice
        options: [trigger, rewrite, all]
        default: trigger
      runs:
        description: "Runs per case (overrides each case's own runs)"
        type: number
        default: 1
permissions:
  contents: read
jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set, so no eval ran. Add the secret to run the paid suites."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.key.outputs.present == 'true'
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Install the Claude Code CLI (pinned)
        if: steps.key.outputs.present == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.300
      - name: Let the eval sandbox start
        # The eval sandbox uses bubblewrap. Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
        # which stops it starting; this lifts that on the throwaway runner only.
        if: steps.key.outputs.present == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Check the runs input
        if: steps.key.outputs.present == 'true'
        env:
          RUNS: ${{ inputs.runs }}
        run: |
          case "$RUNS" in
            ''|*[!0-9]*|0) echo "::error::runs must be a whole number of at least 1 (got '$RUNS')"; exit 2 ;;
          esac
      - name: Trigger suite
        if: steps.key.outputs.present == 'true' && inputs.suite != 'rewrite'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNS: ${{ inputs.runs }}
        run: |
          claude plugin eval . --tag trigger --ablation none --allow-tools "Bash(python3 *)" --runs "$RUNS" -j 4 \
            --no-publish --max-cost-usd 5 --threshold 0.8 --trust-plugin
      - name: Rewrite suite (with a no-plugin baseline arm)
        if: steps.key.outputs.present == 'true' && inputs.suite != 'trigger'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNS: ${{ inputs.runs }}
        run: |
          claude plugin eval . --tag rewrite --runs "$RUNS" -j 4 \
            --no-publish --max-cost-usd 5 --threshold 0.8 --trust-plugin
      - name: Upload the results
        if: steps.key.outputs.present == 'true' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results-${{ inputs.suite }}-${{ github.run_id }}
          path: evals/results/
          if-no-files-found: warn
          retention-days: 30
