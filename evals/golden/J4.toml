text = """## The old hall

The bluestone hall opened in 1889. Standing at the top of the rise, it was the first building travellers saw from the coach road. For thirty years it hosted dances, inquests and the overflow from the school. Seating about three hundred, it was too small by the 1960s.

## The new hall

Facing the oval rather than the road, the 1972 hall turned its back on the old town. It cost a little under $90,000. Costing that much in a town of 2,000 people, it took a decade of raffles and one large bequest to pay off. The old hall became the historical society's museum."""

