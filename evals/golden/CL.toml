schema = 1
group = "CL"

# The claims checker's golden set (agents/claims-checker.md, data/rubrics/claims.md). Each case is a short article
# (`text`) and its ledger claims (`[[case.claim]]`). On each claim, `expect` is the verdict the checker should reach:
# `fail` means at least one `blocking` finding with that claim_id, `pass` means none (a warning is still a pass).
# `why` says why, in one line you can check by reading the case. `expect` and `why` never reach the checker:
# `golden.claims_ledger` drops them when it builds the ledger. Format: evals/golden/README.md.

# ---------------------------------------------------------------- #45: a fact labelled as opinion or hypothetical

[[case]]
