rule = "opinion_label"
content_type = "article"
source = "constructed"
status = "provisional"
origin = "Constructed: #45 pair. A length-of-service fact ledgered as opinion, next to a real recommendation."
text = """## Getting your books ready for June

I've kept the books for local tradies for fifteen years, and June is when the shoebox of receipts comes out.

If you only do one thing this month, I'd start with the bank feeds. Once every transaction comes in on its own, the rest of the end-of-year work is sorting, not hunting.
"""

[[case.claim]]
claim_id = "C001"
expect = "fail"
why = "Fifteen years doing the books is a checkable fact about the writer; the ledger calls it opinion and pins no passage."
text = "I've kept the books for local tradies for fifteen years"
claim_type = "duration"
prominence = "medium"
status = "opinion_or_inference"
locations = [{kind = "body", anchor = "Getting your books ready for June"}]
notes = "The owner's own background, in their voice."

[[case.claim]]
claim_id = "C002"
expect = "pass"
why = "A recommendation the writer frames as their own ('I'd start with'); there's no fact in it to source."
text = "If you only do one thing this month, I'd start with the bank feeds."
claim_type = "premise"
prominence = "medium"
status = "opinion_or_inference"
locations = [{kind = "body", anchor = "Getting your books ready for June"}]

