# ---------------------------------------------------------------- quotes

[[case]]
id = "CL-quote-001"
rule = "quote"
content_type = "article"
source = "constructed"
status = "provisional"
origin = "Constructed: a quote reworded inside quotation marks, next to a count that matches its passage."
text = """## Fix it first

The co-op's coordinator put it this way in the newsletter: "We would always rather fix a bike than sell you a new one."

In 2025 volunteers repaired 412 bikes, according to the same newsletter.
"""

[[case.claim]]
claim_id = "C001"
expect = "fail"
why = "The newsletter says \"We'd rather fix a bike than sell a new one\"; the article adds 'always' and 'you' inside the quotation marks."
text = "The co-op's coordinator put it this way in the newsletter: \"We would always rather fix a bike than sell you a new one.\""
claim_type = "quotation"
prominence = "medium"
status = "verified"
locations = [{kind = "body", anchor = "Fix it first"}]

[case.claim.source]
url = "https://example.org/spoke-and-chain/newsletter-2026-01"
title = "Spoke and Chain Bike Co-op newsletter, January 2026"
publisher = "Spoke and Chain Bike Co-op"
source_tier = "primary"
accessed_at = "2026-10-03T10:00:00+10:00"

[case.claim.binding]
passage = "\"We'd rather fix a bike than sell a new one,\" said the co-op's coordinator."
same_subject = true
same_geography = true
same_period = true
same_denominator = true
supports_strength = true

[[case.claim]]
claim_id = "C002"
expect = "pass"
why = "The newsletter says volunteers repaired 412 bikes in 2025, which is what the article says."
text = "In 2025 volunteers repaired 412 bikes"
claim_type = "count"
prominence = "medium"
status = "verified"
locations = [{kind = "body", anchor = "Fix it first"}]

[case.claim.source]
url = "https://example.org/spoke-and-chain/newsletter-2026-01"
title = "Spoke and Chain Bike Co-op newsletter, January 2026"
publisher = "Spoke and Chain Bike Co-op"
source_tier = "primary"
accessed_at = "2026-10-03T10:00:00+10:00"

[case.claim.binding]
passage = "Volunteers repaired 412 bikes in 2025."
same_subject = true
same_geography = true
same_period = true
same_denominator = true
supports_strength = true

# ---------------------------------------------------------------- what a brief can speak for

[[case]]
id = "CL-brief-001"
rule = "brief"
content_type = "article"
source = "constructed"
status = "provisional"
origin = "Constructed: an electrician's brief used for how a platform ranks listings, next to two facts about their own business."
text = """## Reviews and your listing

Google ranks local businesses with more reviews higher in Maps. I ask every customer for a review when I send the invoice, and my call-out fee is $95.
"""

[[case.claim]]
claim_id = "C001"
expect = "fail"
why = "The only source is the owner's brief, which speaks for their own business, not for how Google ranks listings."
text = "Google ranks local businesses with more reviews higher in Maps."
claim_type = "platform_behaviour"
prominence = "high"
status = "verified"
locations = [{kind = "body", anchor = "Reviews and your listing"}]

[case.claim.source]
kind = "brief"
title = "Owner's brief, 1 October 2026"
source_tier = "primary"

[case.claim.binding]
passage = "Google ranks you higher in Maps if you've got more reviews, so I always ask."
same_subject = true
same_geography = true
same_period = true
same_denominator = true
supports_strength = true

[[case.claim]]
claim_id = "C002"
expect = "pass"
why = "The brief says it word for word, and how the owner asks for reviews is theirs to speak for."
text = "I ask every customer for a review when I send the invoice"
claim_type = "first_hand"
prominence = "medium"
status = "verified"
locations = [{kind = "body", anchor = "Reviews and your listing"}]

[case.claim.source]
kind = "brief"
title = "Owner's brief, 1 October 2026"
source_tier = "primary"

[case.claim.binding]
passage = "I ask every customer for a review when I send the invoice."
same_subject = true
same_geography = true
same_period = true
same_denominator = true
supports_strength = true

[[case.claim]]
claim_id = "C003"
expect = "pass"
why = "The owner's own price, pinned from their brief: 'My call-out fee is $95.'"
text = "my call-out fee is $95"
claim_type = "price"
prominence = "medium"
status = "verified"
locations = [{kind = "body", anchor = "Reviews and your listing"}]

[case.claim.source]
kind = "brief"
title = "Owner's brief, 1 October 2026"
source_tier = "primary"

[case.claim.binding]
passage = "My call-out fee is $95."
same_subject = true
same_geography = true
same_period = true
same_denominator = true
supports_strength = true

# ---------------------------------------------------------------- aggregators

[[case]]
id = "CL-aggregator-001"
rule = "aggregator"
content_type = "article"
source = "constructed"
status = "provisional"
origin = "Constructed: a statistic sourced to a roundup post that cites another report, next to a scoped first-hand fact."
text = """## Do customers read reviews?

73% of customers read online reviews before choosing a tradie. I reply to every review on my listing within a week, good or bad.
"""

[[case.claim]]
claim_id = "C001"
expect = "fail"
why = "The source is a statistics roundup (source_tier aggregator) whose passage cites another report, so it can't support the figure."
text = "73% of customers read online reviews before choosing a tradie."
claim_type = "statistic"
prominence = "high"
status = "verified"
locations = [{kind = "body", anchor = "Do customers read reviews?"}]

[case.claim.source]
url = "https://example.com/blog/review-statistics-2026"
title = "52 online review statistics for 2026"
publisher = "a marketing software blog"
source_tier = "aggregator"
accessed_at = "2026-10-03T10:00:00+10:00"

[case.claim.binding]
passage = "73% of customers read online reviews before choosing a tradie (Consumer Trust Report)."
same_subject = true
same_geography = true
same_period = true
same_denominator = true
supports_strength = true

[[case.claim]]
claim_id = "C002"
expect = "pass"
why = "A first-hand fact inside its scope: the writer checked their own listing and every review has a reply within a week."
text = "I reply to every review on my listing within a week, good or bad."
claim_type = "first_hand"
prominence = "medium"
status = "first_hand"
locations = [{kind = "body", anchor = "Do customers read reviews?"}]

[case.claim.first_hand_scope]
owner = "the writer"
scope = "The writer's replies to reviews on their own business listing, checked on 1 October 2026: all 37 reviews have a reply, each posted within seven days."
method = "Read every review and reply on the listing."
