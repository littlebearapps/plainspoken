[[case]]
id = "JR-12f-001"
rule = "12f"
label = "reject"
content_type = "article"
source = "owner"
status = "confirmed"
origin = "sourdough starter guide (~300 words); reason blames recipe nouns, but one feeding step is copied out three times. Contrast: JR-12f-002"
text = '''
A starter is flour and water that you keep alive by feeding it. To start one, mix 50 grams of wholemeal flour with 50 grams of water in a clean jar, stir it hard, and put the lid on loosely. Leave the jar somewhere warm, around 24 degrees, and mark the level on the jar with a rubber band.

For the next five days, feed the starter once a day. Tip out all but 50 grams of starter, add 50 grams of flour and 50 grams of water, stir, and mark the new level. On day two or three the starter may rise and then go flat. That's normal: the first bacteria to grow aren't the ones you want, and they die back.

By day five or six the starter should double within six to eight hours of a feed and smell sour, like yoghurt. If it doesn't, keep feeding it. Switching from wholemeal flour to white flour at this point is fine, and some bakers find a white flour starter easier to read because the bubbles show through the jar.

Once the starter doubles reliably, you can bake with it. Feed it the night before, and use it when it has doubled and before it falls. A spoonful of starter dropped into a glass of water should float. If it sinks, give the starter another hour or two in the warm spot.

Between bakes, keep the jar in the fridge and feed the starter once a week: tip out all but 50 grams, add 50 grams of flour and 50 grams of water, and leave it on the bench for an hour before it goes back in. A neglected starter usually recovers after two or three feeds at room temperature.

If you bake twice a week, keep the starter on the bench and feed it every day instead: tip out all but 50 grams of starter, add 50 grams of flour and 50 grams of water, stir, and mark the new level on the jar.
'''
kind = "metric"
reason = "The repeats pulling vocabulary variety down are the recipe's working nouns and quantities (starter, flour, water, jar, 50 grams); a removal-only pass would have to cut quantities or steps, and swapping the nouns for synonyms would trade the metric for synonym cycling."
evidence = [
  {line = 3, quote = "feed the starter once a day"},
  {line = 9, quote = "add 50 grams of flour and 50 grams of water"},
]

