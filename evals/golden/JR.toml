text = '''
Worm farms are a really great way to deal with kitchen scraps, and they're really easy to set up. You don't need much space, and the worms do most of the work for you. A lot of people think they're messy or smelly, but if you get a few things right they're really not a problem at all.

The first thing is the bedding. Shredded newspaper and a bit of coir work really well, and it's a great idea to soak them first so they're damp but not dripping. The worms need it moist, so this is one of the most important things to get right early on.

The next thing is what you feed them. Fruit and vegie scraps are great, and so are coffee grounds and tea leaves. Things to avoid are citrus, onion, meat and dairy. Chopping scraps smaller is a really good idea too, because the worms get through them much faster that way.

Where you put the farm is another thing that really matters. Somewhere shady is great, because worms don't like heat, and a spot near the back door makes it easy to empty the scrap bucket. In summer, a wet hessian bag over the top is a great trick for keeping things cool.

After a couple of months you'll have worm castings and liquid you can use on the garden. Both are great for plants, and the liquid is really easy to use: dilute it with water until it looks like weak tea. It's a great little system once it's going, and the worms really don't need much from you.

If things go wrong, it's usually too wet or too much food. Add dry newspaper, feed less for a week, and things usually settle down. It's really not a big thing, and it's a really great thing to get the kids to help with, because it's really easy and it's really a great thing for the garden.
'''
