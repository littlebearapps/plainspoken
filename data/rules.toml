# A profile rule that re-thresholds a universal rule: a justification for either covers both.
[aliases]
"NR-1" = "1"
"NR-2" = "7d"

# Lists whose words get both -ise/-ize and -yse/-yze spellings at load, so every locale catches both.
[spelling]
expand = ["ban_literal", "ban_qualified", "claude_warn"]

[lists]
salience_flags = ["here's the thing", "this matters", "why this matters", "here's why this matters", "the key thing", "what matters here", "it's worth remembering"]
sincerity_markers = ["honest answer", "to be honest", "the honest truth", "let's be honest", "truth be told"]
signposting_openers = ["let's walk through", "let's look at", "here's what", "here's how", "the short version", "the long answer"]
