# plainspoken ruleset. Bumped only by `kaizen apply` with a recorded human approval.
# No human-readable rule reference ships yet: guides/ holds no per-rule text, and Phase 6 added none.
# Ported from the author's earlier private ruleset (v4).
version = "4.3.0"

[thresholds."default"]
em_dash_max = 3
claude_warn_total = 4
conversational_warn = 3
conversational_block = 6
however_max = 2
transition_total_max = 8
transition_single_max = 3
uniform_sentence_run = 5
uniform_tolerance = 0.2
staccato_long_sentence = 25
staccato_short_run = 5
staccato_short_len = 12
staccato_faq_short_run = 7
paragraph_uniform_run = 4
paragraph_uniform_faq_run = 4
bold_bullet_run = 3
ing_opener_section_warn = 3
ing_opener_consecutive_block = 3
trailing_ing_section_block = 2
filler_warn = 3
vague_quantifier_warn = 3
ttr_min = 0.4
mattr_min = 0.46
mattr_blocking = false
burstiness_min = 0.3
opening_top3_max = 0.25
capsule_transition_max = 0.5
paragraph_sd_min = 25
mattr_window = 500
repeat_min = 5
repeat_top = 8
triplets_per_1000w_candidate = 3
bold_spans_per_100w_warn = 1.5
narrative_paragraph_short = 20
narrative_paragraph_long = 80
stock_significance_warn = 2

# Short-form social posts (anti-AI tells severity table, "Social" column): the numeric caps only.
# Severity changes for social (BLOCK vs WARN) aren't modelled; adding them needs a kaizen proposal.
[thresholds.social]
em_dash_max = 1
transition_total_max = 3
transition_single_max = 2
conversational_block = 2
uniform_sentence_run = 3
staccato_short_run = 4
staccato_short_len = 8

