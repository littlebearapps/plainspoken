# Hand-written before/after pairs from the #147 research (proto/synthetic.py): invented text modelled on the
# limits and promises in the eval briefs and fixtures. Each pair changes what the text says; `class` is the meaning-diff class that
# must list it. A regression set (written with the lexicon in view), not a recall estimate.

[[pair]]
id = "m01"
kind = "neg-flip"
class = "negation"
before = "Hosting is a separate bill on our plans. It isn't included in the build price."
after = "Hosting is a separate bill on our plans. It's included in the build price."

